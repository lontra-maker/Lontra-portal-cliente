  body{
    margin:0; font-family:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif; background:var(--bg); color:var(--ink);
    -webkit-font-smoothing:antialiased; line-height:1.45; min-height:100dvh;
  }
  h1,h2,h3{font-family:'Geist',system-ui,sans-serif; letter-spacing:-0.02em; margin:0; color:var(--heading);}
  button{font:inherit; color:inherit;}
  :focus-visible{outline:3px solid var(--gold); outline-offset:2px; border-radius:6px;}
  @media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important;} }

  /* ---------- TOPO ---------- */
  .topo{
    position:relative; overflow:hidden; color:#fff; text-align:center;
    background:radial-gradient(120% 140% at 50% -20%, var(--navy) 0%, var(--navy-dark) 55%, var(--navy-darker) 100%);
    padding:calc(18px + env(safe-area-inset-top)) 20px 54px;
  }
  .topo::after{
    content:""; position:absolute; inset:auto -10% -40px -10%; height:80px; background:var(--bg);
    border-radius:50% 50% 0 0 / 100% 100% 0 0;
  }
  .topo-marca{display:inline-flex; align-items:center; gap:10px; position:relative; z-index:1;}
  .topo-marca img{height:42px; width:auto; filter:drop-shadow(0 2px 6px rgba(0,0,0,.25));}
  .topo-nome{font-family:'Poppins',sans-serif; font-weight:800; font-size:19px; letter-spacing:.3px; line-height:1;}
  .topo-nome b{color:var(--gold); font-weight:800;}
  .topo-sub{font-size:10.5px; letter-spacing:1.6px; opacity:.75; margin-top:4px; text-transform:uppercase;}
  .faixa-tema{
    position:relative; z-index:1; display:inline-block; margin-top:12px; max-width:440px;
    font-size:12px; font-weight:600; padding:6px 12px; border-radius:999px;
    background:rgba(255,255,255,.12); color:#fff; backdrop-filter:blur(4px);
  }

  .wrap{max-width:520px; margin:-34px auto 0; padding:0 16px calc(40px + env(safe-area-inset-bottom)); position:relative; z-index:2;}

  /* ---------- CARTÕES BASE ---------- */
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:18px; margin-bottom:12px;
  }
  .secao{margin:26px 0 10px; display:flex; align-items:center; gap:8px;}
  .secao h2{font-size:15px; font-weight:700;}
  .secao .cont{font-size:11.5px; font-weight:700; color:var(--ink-soft); background:var(--gray-bg); border-radius:999px; padding:2px 8px;}

  /* ---------- ESTADOS (carregando / erro) ---------- */
  .estado{text-align:center; padding:40px 22px;}
  .estado .ic{font-size:42px; margin-bottom:10px;}
  .estado h1{font-size:18px; margin-bottom:6px;}
  .estado p{color:var(--ink-soft); font-size:14px; margin:0 0 18px;}
  .spinner{width:30px; height:30px; border:3px solid var(--border); border-top-color:var(--blue); border-radius:50%; margin:6px auto 14px; animation:girar .8s linear infinite;}
  @keyframes girar{to{transform:rotate(360deg);}}

  /* ---------- TRAVA (4 dígitos) ---------- */
  .trava{text-align:center; padding:30px 22px 26px;}
  .trava-avatar{
    width:64px; height:64px; border-radius:50%; margin:0 auto 14px; display:grid; place-items:center;
    background:var(--amber-bg); font-size:32px;
  }
  .trava h1{font-size:19px; margin-bottom:6px;}
  .trava p{color:var(--ink-soft); font-size:14px; margin:0 0 20px;}
  .digitos{position:relative; display:inline-flex; gap:10px; margin-bottom:6px;}
  .digitos input{
    position:absolute; inset:0; width:100%; height:100%; opacity:0; font-size:16px; border:0; background:transparent;
    caret-color:transparent; color:transparent;
  }
  .slot{
    width:52px; height:60px; border-radius:12px; border:2px solid var(--border); background:var(--surface-2);
    display:grid; place-items:center; font-family:'Geist',system-ui,sans-serif; font-variant-numeric:tabular-nums; font-size:26px; font-weight:700; color:var(--heading);
    transition:border-color .15s, transform .15s;
  }
  .digitos.foco .slot.atual{border-color:var(--blue); box-shadow:0 0 0 4px var(--blue-bg);}
  .digitos.erro .slot{border-color:var(--red);}
  .digitos.erro{animation:tremer .35s;}
  @keyframes tremer{20%,60%{transform:translateX(-6px);}40%,80%{transform:translateX(6px);}}
  .trava-erro{min-height:20px; font-size:13px; font-weight:600; color:var(--red); margin:8px 0 6px;}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px; border:0; cursor:pointer;
    padding:13px 18px; border-radius:12px; font-size:15px; font-weight:700; text-decoration:none;
    transition:transform .08s, filter .15s;
  }
  .btn:active{transform:scale(.98);}
  .btn:disabled{opacity:.6; cursor:default;}
  .btn-primario{background:var(--navy); color:#fff; width:100%; max-width:280px;}
  @media (prefers-color-scheme: dark){ .btn-primario{background:var(--gold); color:#14263A;} }
  .btn-zap{background:#25D366; color:#fff;}
  .selo{display:inline-flex; align-items:center; gap:6px; margin-top:18px; font-size:12px; color:var(--ink-soft);}

  /* ---------- RESUMO ---------- */
  .ola{padding:20px 18px;}
  .ola h1{font-size:21px; line-height:1.25;}
  .ola .atualizado{font-size:12px; color:var(--ink-soft); margin-top:4px;}
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px;}
  .chip{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; padding:7px 11px; border-radius:999px;}

  /* ---------- PILLS ---------- */
  .pill{display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:999px; font-size:11.5px; font-weight:700; white-space:nowrap;}
  .t-blue{background:var(--blue-bg); color:var(--blue);}
  .t-green{background:var(--green-bg); color:var(--green);}
  .t-red{background:var(--red-bg); color:var(--red);}
  .t-amber{background:var(--amber-bg); color:var(--amber);}
  .t-gray{background:var(--gray-bg); color:var(--gray);}

  /* ---------- AGENDA ---------- */
  .visita{display:flex; gap:14px; align-items:center;}
  .cal{
    flex-shrink:0; width:56px; border-radius:12px; overflow:hidden; text-align:center; border:1px solid var(--border);
    background:var(--surface-2);
  }
  .cal .mes{background:var(--gold); color:#14263A; font-size:10.5px; font-weight:800; text-transform:uppercase; padding:3px 0; letter-spacing:.5px;}
  .cal .dia{font-family:'Geist',system-ui,sans-serif; font-variant-numeric:tabular-nums; font-weight:700; font-size:22px; color:var(--heading); padding:4px 0 2px; line-height:1.1;}
  .cal .sem{font-size:10px; color:var(--ink-soft); padding-bottom:5px;}
  .visita-info{min-width:0;}
  .visita-info .hora{font-weight:800; color:var(--heading); font-size:14px;}
  .visita-info .tit{font-size:13.5px; margin-top:1px;}
  .visita-info .loc{font-size:12px; color:var(--ink-soft); margin-top:3px;}

  /* ---------- CARTÃO DE ITEM (OS / orçamento / diagnóstico) ---------- */
  .item-topo{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .item-num{font-family:'Geist',system-ui,sans-serif; font-variant-numeric:tabular-nums; font-weight:700; font-size:15px; color:var(--heading);}
  .item-data{font-size:12px; color:var(--ink-soft); margin-top:1px;}
  .item-tit{font-size:14px; margin:10px 0 0;}
  .item-sub{font-size:12.5px; color:var(--ink-soft); margin-top:4px;}
  .faixa-valor{display:flex; justify-content:space-between; align-items:baseline; margin-top:14px; padding-top:12px; border-top:1px dashed var(--border);}
  .faixa-valor .k{font-size:12px; color:var(--ink-soft);}
  .faixa-valor .v{font-family:'Geist',system-ui,sans-serif; font-variant-numeric:tabular-nums; font-weight:700; font-size:17px; color:var(--heading);}
  .aviso{font-size:12.5px; padding:10px 12px; border-radius:10px; margin-top:10px; line-height:1.45;}

  /* passos do andamento */
  .passos{display:flex; align-items:flex-start; margin:16px 0 2px;}
  .passo{flex:1; text-align:center; position:relative; font-size:11px; color:var(--ink-soft); font-weight:600;}
  .passo .bola{
    width:22px; height:22px; border-radius:50%; margin:0 auto 6px; display:grid; place-items:center;
    background:var(--surface-2); border:2px solid var(--border); font-size:11px; font-weight:800; position:relative; z-index:1;
  }
  .passo:not(:first-child)::before{
    content:""; position:absolute; top:10px; right:50%; width:100%; height:2px; background:var(--border);
  }
  .passo.feito .bola{background:var(--green); border-color:var(--green); color:#fff;}
  .passo.feito:not(:first-child)::before, .passo.atual:not(:first-child)::before{background:var(--green);}
  .passo.atual .bola{background:var(--surface); border-color:var(--blue); box-shadow:0 0 0 4px var(--blue-bg);}
  .passo.atual{color:var(--heading);}

  /* expandir */
  .abrir{
    width:100%; margin-top:12px; background:var(--surface-2); border:1px solid var(--border); border-radius:10px;
    padding:10px; font-size:13px; font-weight:700; color:var(--heading); cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .abrir .seta{transition:transform .2s;}
  .abrir[aria-expanded="true"] .seta{transform:rotate(180deg);}
  .detalhes{margin-top:12px; display:flex; flex-direction:column; gap:10px;}
  .detalhes[hidden]{display:none;}
  .linha-kv{display:flex; justify-content:space-between; gap:12px; font-size:13px;}
  .linha-kv .k{color:var(--ink-soft);}
  .linha-kv .v{font-weight:600; text-align:right;}
  .rotulo{font-size:11px; font-weight:800; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.4px; margin-top:4px;}

  /* garantia */
  .garantia{border-radius:12px; padding:10px 12px;}
  .garantia .g-topo{display:flex; justify-content:space-between; gap:10px; font-size:12.5px; font-weight:700;}
  .barra{height:6px; border-radius:99px; background:rgba(127,127,127,.18); margin-top:8px; overflow:hidden;}
  .barra i{display:block; height:100%; border-radius:99px; background:currentColor;}
  .garantia .g-sub{font-size:11.5px; opacity:.85; margin-top:6px; font-weight:500;}

  /* linha do tempo */
  .tempo{list-style:none; margin:0; padding:0 0 0 4px;}
  .tempo li{position:relative; padding:0 0 10px 18px; font-size:12.5px;}
  .tempo li::before{content:""; position:absolute; left:0; top:5px; width:8px; height:8px; border-radius:50%; background:var(--blue);}
  .tempo li:not(:last-child)::after{content:""; position:absolute; left:3px; top:15px; bottom:-1px; width:2px; background:var(--border);}
  .tempo li:first-child::before{background:var(--green); box-shadow:0 0 0 3px var(--green-bg);}
  .tempo .quando{color:var(--ink-soft); font-size:11.5px;}

  /* documentos */
  .docs{display:flex; flex-direction:column; gap:8px;}
  .btn-doc{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left; cursor:pointer;
    background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:11px 12px;
  }
  .btn-doc .ic{width:36px; height:36px; border-radius:10px; display:grid; place-items:center; font-size:18px; flex-shrink:0;}
  .btn-doc .tx{flex:1; min-width:0;}
  .btn-doc .tx b{display:block; font-size:13.5px; color:var(--heading);}
  .btn-doc .tx span{display:block; font-size:11.5px; color:var(--ink-soft);}
  .btn-doc .acao{font-size:12px; font-weight:800; color:var(--blue);}
  .btn-doc:disabled{opacity:.7;}

  .orc-valores{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px;}
  .orc-valores div{background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:10px 12px;}
  .orc-valores .k{display:block; font-size:11px; color:var(--ink-soft); text-transform:uppercase; font-weight:700;}
  .orc-valores .v{display:block; font-family:'Geist',system-ui,sans-serif; font-variant-numeric:tabular-nums; font-size:16px; font-weight:700; color:var(--heading); margin-top:2px;}
  .orc-itens{margin:0; padding:0; list-style:none; font-size:13px;}
  .orc-itens li{display:flex; justify-content:space-between; gap:10px; padding:6px 0; border-bottom:1px dashed var(--border);}
  .orc-itens li:last-child{border-bottom:0;}
  .bloco-diag{border-left:3px solid var(--blue); padding:2px 0 2px 12px; margin-top:12px; font-size:12.5px;}
  .bloco-diag p{margin:4px 0 0;}

  /* boas-vindas */
  .boas-vindas{padding:28px 20px 24px; text-align:center;}
  .boas-vindas h1{font-size:20px; margin-bottom:8px;}
  .bv-intro{color:var(--ink-soft); font-size:14px; margin:0 0 16px;}
  .bv-lista{list-style:none; margin:0 0 22px; padding:0; text-align:left; display:flex; flex-direction:column; gap:10px;}
  .bv-lista li{display:flex; gap:12px; align-items:flex-start; padding:10px 12px; border-radius:12px; background:var(--surface-2); border:1px solid var(--border);}
  .bv-ic{width:34px; height:34px; border-radius:10px; display:grid; place-items:center; font-size:17px; background:var(--surface); border:1px solid var(--border); flex-shrink:0;}
  .bv-tx b{display:block; font-size:13.5px; color:var(--heading);}
  .bv-tx span{display:block; font-size:12.5px; color:var(--ink-soft); margin-top:1px;}

  /* tela do código */
  .trava-aviso{min-height:18px; font-size:12.5px; color:var(--ink-soft); margin:10px auto 0; max-width:320px;}
  .trava-aviso:empty{margin:0;}
  .link-btn{display:block; margin:14px auto 0; background:none; border:0; color:var(--blue); font-weight:700; font-size:13px; cursor:pointer; padding:6px 10px;}
  .link-btn:disabled{color:var(--ink-soft); cursor:default; font-weight:600;}

  /* todas as atualizações */
  .atualizacoes{list-style:none; margin:0; padding:0;}
  .atualizacoes li{display:flex; gap:12px; padding:10px 0; position:relative;}
  .atualizacoes li + li{border-top:1px dashed var(--border);}
  .atualizacoes li[hidden]{display:none;}
  .at-ic{width:32px; height:32px; border-radius:50%; background:var(--surface-2); border:1px solid var(--border); display:grid; place-items:center; font-size:15px; flex-shrink:0;}
  .at-tx{min-width:0; display:flex; flex-direction:column;}
  .at-tx b{font-size:13.5px; color:var(--heading); line-height:1.3;}
  .at-tx span{font-size:12.5px; color:var(--ink); margin-top:1px; overflow-wrap:anywhere;}
  .at-tx time{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
  .atualizacoes li:first-child .at-ic{background:var(--green-bg); border-color:transparent;}

  /* ---------- animações (só CSS; "reduzir movimento" desliga tudo) ---------- */
  @keyframes p-entra{from{opacity:0; transform:translateY(12px);}to{opacity:1; transform:none;}}
  @keyframes p-pop{0%{transform:scale(.85);}60%{transform:scale(1.08);}100%{transform:scale(1);}}
  @keyframes p-cresce{from{transform:scaleX(0);}to{transform:scaleX(1);}}
  @keyframes p-pulso{0%,100%{box-shadow:0 0 0 4px var(--blue-bg);}50%{box-shadow:0 0 0 8px var(--blue-bg);}}
  /* cada bloco do painel entra em cascata */
  #conteudo > *{animation:p-entra .42s cubic-bezier(.2,.8,.2,1) both;}
  #conteudo > :nth-child(2){animation-delay:.05s;} #conteudo > :nth-child(3){animation-delay:.1s;}
  #conteudo > :nth-child(4){animation-delay:.15s;} #conteudo > :nth-child(5){animation-delay:.2s;}
  #conteudo > :nth-child(6){animation-delay:.25s;} #conteudo > :nth-child(n+7){animation-delay:.3s;}
  /* andamento da OS: a linha "corre" e as bolinhas acendem em sequência até a etapa atual */
  .passo:not(:first-child)::before{transform-origin:left center;}
  .passo.feito:not(:first-child)::before, .passo.atual:not(:first-child)::before{animation:p-cresce .5s cubic-bezier(.2,.8,.2,1) both;}
  .passo:nth-child(2)::before{animation-delay:.25s !important;} .passo:nth-child(3)::before{animation-delay:.55s !important;}
  .passo.feito .bola, .passo.atual .bola{animation:p-pop .4s cubic-bezier(.2,.8,.2,1) both;}
  .passo:nth-child(1) .bola{animation-delay:.1s;} .passo:nth-child(2) .bola{animation-delay:.45s;} .passo:nth-child(3) .bola{animation-delay:.75s;}
  .passo.atual .bola{animation:p-pop .4s cubic-bezier(.2,.8,.2,1) .45s both, p-pulso 2.2s ease-in-out 1s infinite;}
  /* barra da garantia enche */
  .barra i{transform-origin:left center; animation:p-cresce .8s cubic-bezier(.2,.8,.2,1) .2s both;}
  /* detalhes abrem deslizando */
  .detalhes:not([hidden]){animation:p-entra .3s cubic-bezier(.2,.8,.2,1) both;}
  .abrir{transition:background-color .15s, border-color .15s;}
  .abrir:hover{border-color:var(--border); background:var(--surface);}
  /* caixinhas do código */
  .slot.cheio{animation:p-pop .22s cubic-bezier(.2,.8,.2,1);}
  .btn-doc{transition:transform .12s, border-color .15s, background-color .15s;}
  .btn-doc:active{transform:scale(.985);}
  @media (hover:hover){ .btn-doc:hover{border-color:var(--blue);} }
  .chip{animation:p-pop .4s cubic-bezier(.2,.8,.2,1) .25s both;}

  /* ícones desenhados (no lugar dos emojis) */
  .icone{display:inline-block; vertical-align:-0.16em; flex-shrink:0;}
  .estado .ic{width:64px; height:64px; margin:0 auto 14px; border-radius:18px; display:grid; place-items:center; background:var(--blue-bg); color:var(--blue);}
  .estado .ic .icone{width:30px; height:30px;}
  .trava-avatar{color:var(--amber);}
  .trava-avatar .icone{width:28px; height:28px;}
  .avatar-logo{background:var(--surface-2) !important; box-shadow:inset 0 0 0 1px var(--border);}
  .avatar-logo img{width:46px; height:auto;}
  .bv-ic{color:var(--blue);}
  .at-ic{color:var(--ink-soft);}
  .atualizacoes li:first-child .at-ic{color:var(--green);}
  .btn-doc .ic .icone{width:18px; height:18px;}
  .passo .bola .icone{width:12px; height:12px; stroke-width:3;}
  .chip .icone, .aviso .icone, .g-topo .icone, .selo .icone, .seg .icone, .btn .icone{width:15px; height:15px;}

  .vazio{text-align:center; color:var(--ink-soft); font-size:13.5px; padding:26px 16px;}

  /* ---------- RODAPÉ ---------- */
  .rodape{text-align:center; margin-top:28px;}
  .rodape .btn-zap{width:100%; max-width:320px;}
  .rodape .info{font-size:12px; color:var(--ink-soft); margin-top:12px;}
  .rodape .seg{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-soft); margin-top:10px;}
  .sair{background:none; border:0; color:var(--ink-soft); font-size:12px; text-decoration:underline; cursor:pointer; margin-top:6px;}
</style>
</head>
<body>

<script>
// ---------------------------------------------------------------------
// Temas sazonais - troca as cores do portal sozinho, baseado na data de hoje, cobrindo as
// campanhas de conscientização (meses coloridos) e os feriados nacionais. Cada tema tem de 2
// a 3 mensagens diferentes, escolhidas por sorteio a cada visita. Os feriados de UM DIA SÓ
// ficam checados PRIMEIRO na lista - assim, se um feriado cair no meio de um mês de campanha,
// o feriado "ganha" só naquele dia específico, sem precisar recortar as datas manualmente.
// Dá pra também forçar um tema manualmente (ignorando a data), configurável no sistema.
// ---------------------------------------------------------------------

function ajustarCor(hex, fator){
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  const ajustar = (v)=> fator < 0 ? Math.round(v * (1+fator)) : Math.round(v + (255-v)*fator);
  const nR = Math.max(0, Math.min(255, ajustar(r)));
  const nG = Math.max(0, Math.min(255, ajustar(g)));
  const nB = Math.max(0, Math.min(255, ajustar(b)));
  return '#' + [nR,nG,nB].map(v=>v.toString(16).padStart(2,'0')).join('');
}

function montarTema(id, periodoFn, corOficial, mensagens){
  return {
    id, periodo: periodoFn, mensagens,
    cores: {
      navy: ajustarCor(corOficial, -0.55),
      navyDark: ajustarCor(corOficial, -0.68),
      navyDarker: ajustarCor(corOficial, -0.80),
      gold: corOficial,
    },
  };
}

function ic(nome, tamanho){
  const t = tamanho || 16;
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 24 24'); svg.setAttribute('width', t); svg.setAttribute('height', t);
  svg.setAttribute('fill', 'none'); svg.setAttribute('stroke', 'currentColor'); svg.setAttribute('stroke-width', '2');
  svg.setAttribute('stroke-linecap', 'round'); svg.setAttribute('stroke-linejoin', 'round'); svg.setAttribute('aria-hidden', 'true');
  svg.setAttribute('class', 'icone');
  svg.innerHTML = ICONES[nome] || '';
  return svg;
}
function textoComIcone(txt){
  const t = String(txt);
  if(EMOJI_ICONE[t]) return [ic(EMOJI_ICONE[t])];
  const m = t.match(/^(\S+)\s+([\s\S]*)$/);
  if(m && EMOJI_ICONE[m[1]]) return [ic(EMOJI_ICONE[m[1]]), document.createTextNode(' ' + m[2])];
  return [document.createTextNode(t)];
}

// ---------- utilidades ----------
// Monta elementos sem innerHTML: nada que vem dos dados vira código.
function h(tag, attrs, ...filhos){
  const el = document.createElement(tag);
  if(attrs) for(const [k,v] of Object.entries(attrs)){
    if(v==null || v===false) continue;
    if(k==='class') el.className = v;
    else if(k==='style') el.setAttribute('style', v);
    else if(k.startsWith('on') && typeof v==='function') el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v===true ? '' : v);
  }
  for(const f of filhos.flat(Infinity)){
    if(f==null || f===false) continue;
    if(f instanceof Node) el.append(f);
    else el.append(...textoComIcone(f));
  }
  return el;
}

function dataISOlocal(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function somarDias(iso, dias){ const d = new Date(iso+'T00:00:00'); d.setDate(d.getDate()+(parseInt(dias)||0)); return dataISOlocal(d); }
function diasEntre(a, b){ return Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00'))/86400000); }

}

// Em produção: raw.githubusercontent.com/<usuario>/<repo>/main/... (descoberto pelo endereço do
// GitHub Pages). Rodando localmente (testes), lê os arquivos da própria pasta.
function urlArquivo(caminho){
  const host = location.hostname;
  if(host==='localhost' || host==='127.0.0.1' || location.protocol==='file:'){
    return new URL(caminho, location.href).href;
  }
  const owner = host.split('.')[0];

}

// ---------- criptografia ----------
function b64ParaBytes(s){
  let b = String(s||'').replace(/-/g,'+').replace(/_/g,'/');
  while(b.length % 4) b += '=';
  const bin = atob(b); const out = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
}
let CHAVE = null;
async function prepararChave(chaveTexto){
  CHAVE = await crypto.subtle.importKey('raw', b64ParaBytes(chaveTexto), {name:'AES-GCM'}, false, ['decrypt']);
}
async function decifrar(bytes){
  const iv = bytes.subarray(0, 12), ct = bytes.subarray(12);
  return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM', iv}, CHAVE, ct));
}

// ---------- acesso: código por e-mail (ou 4 últimos números do telefone) ----------
// A função "portal-acesso" (Supabase) confere o código e devolve a 2ª metade da chave (k2).
// Chave final = metade do link (#k=) XOR k2. Sem as duas, os dados não abrem.
const FUNCAO = 'https://buaeawabgfqjvnfsniit.supabase.co/functions/v1/portal-acesso';
// "Prova do link": sha256("<id>:<metade da chave do link>"). Sem ela a função responde "não encontrado".
let PROVA = '';
async function calcularProva(id, k1){
  const dig = new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(id + ':' + k1)));
  return Array.from(dig).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function chamarFuncao(corpo){
  const r = await fetch(FUNCAO, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({...corpo, prova: PROVA}), cache:'no-store'});
  let j = null; try{ j = await r.json(); }catch(e){}
  return {status: r.status, j: j || {}};
}
function xorB64(a, b){
  const x = b64ParaBytes(a), y = b64ParaBytes(b);
  const out = new Uint8Array(x.length);
  for(let i=0;i<x.length;i++) out[i] = x[i] ^ y[i];
  return out;
}

  };

    if(api.aoMudar) api.aoMudar(valor);
  }
  input.addEventListener('input', ()=>{ valor = input.value.replace(/\D/g,'').slice(0,4); input.value = valor; caixa.classList.remove('erro'); pintar(); });
  input.addEventListener('focus', ()=> caixa.classList.add('foco'));
  input.addEventListener('blur', ()=> caixa.classList.remove('foco'));
  caixa.addEventListener('click', ()=> input.focus());
  setTimeout(pintar, 0);
  return api;
}

function telaCodigo(info, aoLiberar){
  const porEmail = info.metodo === 'email';
  const dig = caixaDigitos();
  const erro = h('div', {class:'trava-erro', role:'alert'});
  const aviso = h('div', {class:'trava-aviso', 'aria-live':'polite'});
  const botao = h('button', {type:'button', class:'btn btn-primario', disabled:true}, 'Entrar');
  const reenviar = porEmail ? h('button', {type:'button', class:'link-btn', disabled:true}, 'Reenviar código') : null;
  let ocupado = false, timer = null;
  dig.aoMudar = (v)=>{ botao.disabled = v.length!==4 || ocupado; if(v) erro.textContent = ''; };

  const contagem = (seg)=>{
    if(!reenviar) return;
    clearInterval(timer);
    let s = Math.max(0, seg|0);
    const tick = ()=>{
      if(s<=0){ clearInterval(timer); reenviar.disabled = false; reenviar.textContent = 'Reenviar código'; return; }
      reenviar.disabled = true; reenviar.textContent = `Reenviar código em ${s}s`; s--;
    };
    tick(); timer = setInterval(tick, 1000);
  };
  const enviar = async ()=>{
    aviso.textContent = 'Enviando o código…'; erro.textContent = '';
    if(reenviar) reenviar.disabled = true;
    try{
      const {status, j} = await chamarFuncao({acao:'enviar', id:ID});
      if(status===200){ aviso.textContent = `Enviamos um código de 4 números para ${j.destino || 'o seu e-mail'}. Confira também a caixa de spam.`; contagem(60); }
      else if(j.erro==='aguarde'){ aviso.textContent = `Já enviamos um código para ${j.destino || 'o seu e-mail'} há pouco. Use ele, ou aguarde pra pedir outro.`; contagem(j.segundos||60); }
      else if(j.erro==='limite_hora'){ aviso.textContent = ''; erro.textContent = 'Muitos códigos pedidos nesta hora. Use o último que chegou ou tente mais tarde.'; contagem(300); }
      else { aviso.textContent = ''; erro.textContent = 'Não consegui enviar o e-mail agora. Tente de novo em instantes.'; contagem(15); }
    }catch(e){ aviso.textContent = ''; erro.textContent = 'Sem conexão. Confira sua internet.'; contagem(5); }
  };
  const tentar = async ()=>{
    if(dig.valor.length!==4 || ocupado) return;
    ocupado = true; botao.disabled = true; botao.textContent = 'Conferindo…'; erro.textContent = '';
    try{
      const {status, j} = await chamarFuncao({acao:'verificar', id:ID, codigo:dig.valor});
      if(status===200 && j.k2){
        if(await aoLiberar(j.k2)) return;
        erro.textContent = 'Não consegui abrir seus dados com esse link. Confira se copiou o link inteiro.';
      } else {
        const msgs = {
          codigo_errado: porEmail ? `Código incorreto. Você ainda tem ${j.restantes} tentativa(s).` : `Números não conferem. Você ainda tem ${j.restantes} tentativa(s).`,
          expirado: 'Esse código venceu. Toque em "Reenviar código" pra receber outro.',
          tentativas: 'Muitas tentativas erradas. Toque em "Reenviar código" pra receber um novo.',
          bloqueado: `Muitas tentativas erradas. Tente de novo em ${j.minutos||15} minuto(s).`,
        };
        erro.textContent = msgs[j.erro] || 'Não deu certo agora. Tente de novo.';
        if(porEmail && (j.erro==='expirado' || j.erro==='tentativas')) contagem(0);
        dig.tremer(); dig.limpar(); dig.input.focus();
      }
    }catch(e){ erro.textContent = 'Sem conexão. Confira sua internet e tente de novo.'; }
    ocupado = false; botao.textContent = 'Entrar'; botao.disabled = dig.valor.length!==4;
  };
  dig.input.addEventListener('keydown', e=>{ if(e.key==='Enter') tentar(); });
  botao.addEventListener('click', tentar);
  if(reenviar) reenviar.addEventListener('click', enviar);

  mostrar(h('section', {class:'card trava'},
    h('div', {class:'trava-avatar', 'aria-hidden':'true'}, porEmail ? '✉️' : '🔒'),
    h('h1', null, 'Confirme que é você'),
    porEmail
      ? h('p', null, 'Digite o ', h('strong', null, 'código de 4 números'), ' que enviamos pro seu e-mail e toque em ', h('strong', null, 'Entrar'), '.')
      : h('p', null, 'Digite os ', h('strong', null, '4 últimos números'), ' do seu telefone cadastrado e toque em ', h('strong', null, 'Entrar'), '.'),
    dig.caixa, aviso, erro, botao, reenviar,
    h('div', {class:'selo'}, '🔒 Seus dados ficam criptografados'),
  ));
  if(porEmail) enviar();
  setTimeout(()=> dig.input.focus(), 50);
}

function pill(texto, classe){ return h('span', {class:'pill '+classe}, texto); }

function blocoGarantia(o){
  if(o.g === null) return h('div', {class:'garantia t-gray'}, h('div', {class:'g-topo'}, '➖ Serviço sem garantia'));
  if(!o.g) return null;
  if(o.g.pendente) return h('div', {class:'garantia t-amber'},
    h('div', {class:'g-topo'}, '⏳ Garantia começa na entrega'),
    h('div', {class:'g-sub'}, 'Ela passa a contar quando o serviço for concluído e o equipamento entregue.'));
  if(!o.g.inicio) return null;
  const hoje = dataISOlocal(new Date());
  return [['fisica','Física (montagem/reparo)'], ['software','Software e configurações']].map(([campo, rotulo])=>{
    const dias = parseInt(o.g[campo])||0;
    if(!dias) return null;
    const fim = somarDias(o.g.inicio, dias);
    const restam = diasEntre(hoje, fim);
    const ok = restam >= 0;
    const pct = Math.max(0, Math.min(100, (restam/dias)*100));
    return h('div', {class:'garantia ' + (ok ? 't-green' : 't-red')},
      h('div', {class:'g-topo'}, h('span', null, (ok ? '✔ ' : '✘ ') + 'Garantia ' + rotulo), h('span', null, ok ? `${restam} dia(s)` : 'vencida')),
      ok ? h('div', {class:'barra'}, h('i', {style:`width:${pct}%`})) : null,
      h('div', {class:'g-sub'}, ok ? `Válida até ${dataBR(fim)}` : `Venceu em ${dataBR(fim)}`));
  });
}

function blocoPassos(status){
  const info = STATUS[status] || STATUS.em_andamento;
  if(info.passo < 0) return null;
  const nomes = ['Recebido', 'Em andamento', 'Pronto'];
  // passo 1 = em andamento (etapa 2 é a atual), 2 = falta pagamento (etapa 3 é a atual), 3 = tudo feito
  const etapaAtual = info.passo>=3 ? 4 : info.passo+1;
  return h('div', {class:'passos', role:'img', 'aria-label': 'Andamento: ' + info.t},
    nomes.map((n, i)=>{
      const etapa = i+1;
      const feito = etapa < etapaAtual;
      const cls = 'passo' + (feito ? ' feito' : etapa===etapaAtual ? ' atual' : '');
      return h('div', {class:cls}, h('div', {class:'bola'}, feito ? '✓' : ''), n);
    }));
}

function botaoDoc(tipo, caminho, numero, cliente){
  const d = DOCS[tipo];
  const acao = h('span', {class:'acao'}, 'Baixar');
  const btn = h('button', {type:'button', class:'btn-doc'},
    h('span', {class:'ic '+d.cor, 'aria-hidden':'true'}, d.ic),
    h('span', {class:'tx'}, h('b', null, d.nome), h('span', null, 'PDF')),
    acao);
  btn.addEventListener('click', async ()=>{
    btn.disabled = true; acao.textContent = 'Abrindo…';
    try{
      const r = await fetch(urlArquivo(caminho) + '?t=' + Date.now(), {cache:'no-store'});
      if(!r.ok) throw new Error('arquivo indisponível (' + r.status + ')');
      const bytes = caminho.endsWith('.bin') ? await decifrar(new Uint8Array(await r.arrayBuffer())) : new Uint8Array(await r.arrayBuffer());
      const url = URL.createObjectURL(new Blob([bytes], {type:'application/pdf'}));
      const a = h('a', {href:url, download: nomeArquivo(d.nome, numero, cliente)});
      document.body.append(a); a.click(); a.remove();
      setTimeout(()=> URL.revokeObjectURL(url), 10000);
      acao.textContent = 'Baixado';
    }catch(e){
      acao.textContent = 'Tentar de novo';
      alert('Não consegui abrir esse documento agora. Tenta de novo em instantes.');
    }finally{ btn.disabled = false; }
  });
  return btn;
}

// Linha do tempo com TODAS as atualizações (nada fica de fora): abertura e cada mudança de status
// das OS, orçamentos, diagnósticos e todas as visitas - da mais recente pra mais antiga.
function blocoAtualizacoes(dados){
  const ev = [];
  const hoje = dataISOlocal(new Date());
  const STATUS_IC = {concluido:'✅', cancelado:'✖️', arquivado:'⏸️', esperando_peca:'📦', aguardando_aprovacao:'✋', manutencao:'🛠️', em_analise:'🔍', pendente_pagamento:'💳', em_andamento:'🛠️'};
  (dados.o||[]).forEach(o=>{
    if(o.d) ev.push({q:o.d, ic:'🧾', t:`OS #${o.n} aberta`, s:o.t || o.eq || ''});
    (o.h||[]).forEach(x=> ev.push({q:x.d, ic:STATUS_IC[x.s]||'🔄', t:`OS #${o.n}: ${(STATUS[x.s]||{}).t || x.s}`, s:o.t || ''}));
  });
  (dados.orc||[]).forEach(o=>{
    if(o.diagnostico && o.diagnostico.data) ev.push({q:o.diagnostico.data, ic:'🔍', t:`Diagnóstico ${o.diagnostico.numero||''}`, s:o.diagnostico.equipamento||''});
    ev.push({q:o.data, ic:'💰', t:`Orçamento ${o.numero||''}: ${(ORC_STATUS[o.status]||ORC_STATUS.em_preparo).t}`, s:`À vista ${brl(o.totalAVista)}`});
  });
  (dados.diag||[]).forEach(d=> ev.push({q:d.data, ic:'🔍', t:`Diagnóstico ${d.numero||''}: equipamento em análise`, s:d.equipamento||''}));
  (dados.a||[]).forEach(a=>{
    const rot = a.s==='concluido' ? 'Visita realizada' : a.s==='cancelado' ? 'Visita cancelada' : ((a.d||'') >= hoje ? 'Visita marcada' : 'Visita agendada');
    ev.push({q:(a.d||'') + (a.h ? 'T'+a.h : ''), ic: a.s==='cancelado' ? '✖️' : '📅', t:rot, s:`${a.t||'Visita técnica'}${a.l ? ' · ' + a.l : ''}`});
  });
  const validos = ev.filter(e=> e.q).sort((a,b)=> String(b.q).localeCompare(String(a.q)));
  if(!validos.length) return [];
  const quando = (q)=>{
    if(String(q).length<=10) return dataBR(q);
    const d = new Date(q); if(isNaN(d)) return dataBR(q);
    return d.toLocaleDateString('pt-BR') + ' às ' + d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
  };
  const LIMITE = 6;
  const itens = validos.map((e,i)=> h('li', {class: i>=LIMITE ? 'extra' : null, hidden: i>=LIMITE},
    h('span', {class:'at-ic', 'aria-hidden':'true'}, e.ic),
    h('div', {class:'at-tx'}, h('b', null, e.t), e.s ? h('span', null, e.s) : null, h('time', null, quando(e.q))),
  ));
  const lista = h('ul', {class:'atualizacoes'}, itens);
  let mais = null;
  if(validos.length > LIMITE){
    mais = h('button', {type:'button', class:'abrir', 'aria-expanded':'false'}, `Ver todas as ${validos.length} atualizações`);
    mais.addEventListener('click', ()=>{
      const abrir = mais.getAttribute('aria-expanded')!=='true';
      lista.querySelectorAll('li.extra').forEach(li=> li.hidden = !abrir);
      mais.setAttribute('aria-expanded', String(abrir));
      mais.textContent = abrir ? 'Mostrar menos' : `Ver todas as ${validos.length} atualizações`;
    });
  }
  return secao('Todas as atualizações', validos.length, h('section', {class:'card'}, lista, mais));
}

function painel(dados){
  const cliente = dados.c || '';
  const primeiro = cliente.split(' ')[0];
  const hoje = dataISOlocal(new Date());
  const ordens = (dados.o||[]).slice().sort((a,b)=> (b.d||'').localeCompare(a.d||''));
  const visitas = (dados.a||[]).filter(a=> a.s==='agendado' && (a.d||'') >= hoje).sort((a,b)=> (a.d+a.h).localeCompare(b.d+b.h));
  const diags = dados.diag || [];
  const orcs = dados.orc || [];
  const ativas = ordens.filter(o=> (STATUS[o.s]||{passo:1}).passo>0 && o.s!=='concluido').length;
  const aprovar = orcs.filter(o=> o.status==='enviado').length + ordens.filter(o=> o.s==='aguardando_aprovacao').length;

  const chips = [
    ativas ? h('span', {class:'chip t-blue'}, `🛠️ ${ativas} em andamento`) : null,
    aprovar ? h('span', {class:'chip t-amber'}, `✋ ${aprovar} aguardando você`) : null,
    visitas.length ? h('span', {class:'chip t-green'}, `📅 ${visitas.length} visita(s) marcada(s)`) : null,
    !ativas && !aprovar && !visitas.length && ordens.length ? h('span', {class:'chip t-green'}, '✔ Tudo em dia') : null,
  ];

  const sair = h('button', {type:'button', class:'sair'}, 'Sair deste aparelho');
  sair.addEventListener('click', ()=>{ try{ sessionStorage.removeItem('lh_k2_'+ID); }catch(e){} location.reload(); });

  mostrar(
    h('section', {class:'card ola'},
      h('h1', null, primeiro ? `Olá, ${primeiro}!` : 'Olá!'),
      dados.atualizadoEm ? h('div', {class:'atualizado'}, 'Atualizado ' + quandoRelativo(dados.atualizadoEm)) : null,
      h('div', {class:'chips'}, chips)),
    blocoAtualizacoes(dados),
    visitas.length ? secao('Próximas visitas', visitas.length, visitas.map(cartaoVisita)) : [],
    orcs.length ? secao('Orçamentos', orcs.length, orcs.map(o=>cartaoOrcamento(o, cliente))) : [],
    diags.length ? secao('Em análise', diags.length, diags.map(d=>cartaoDiagnostico(d, cliente))) : [],
    secao('Ordens de serviço', ordens.length,
      ordens.length ? ordens.map(o=>cartaoOS(o, cliente)) : h('div', {class:'card vazio'}, '🧾 Nenhuma ordem de serviço ainda.')),
    h('footer', {class:'rodape'},
      h('a', {class:'btn btn-zap', href: linkZap(`Olá! Sou ${cliente||'cliente'} e vim pelo portal de acompanhamento.`), target:'_blank', rel:'noopener'}, '💬 Falar com a LontraHelp'),
      h('div', {class:'info'}, `LontraHelp - Montagem e Formatação · ${CONTATO.zapTexto} · ${CONTATO.insta}`),
      h('div', {class:'seg'}, '🔒 Página protegida com criptografia'),
      h('div', null, sair)),
  );
}

// ---------- início ----------
let ID = null;
async function iniciar(){
  const params = new URLSearchParams(location.search);
  ID = params.get('p');
  const k1 = (location.hash.match(/[#&]k=([A-Za-z0-9_-]+)/)||[])[1];

  if(ID && k1){
    if(!/^[A-Za-z0-9_-]{8,64}$/.test(ID)) return telaEstado('😕', 'Link inválido', 'Esse link parece estar incompleto. Peça um novo pra LontraHelp.', true);
    if(!(window.crypto && crypto.subtle)) return telaEstado('📵', 'Navegador sem suporte', 'Abra esse link no Chrome, Safari ou Edge atualizados.', false);
    PROVA = await calcularProva(ID, k1);

    // Busca o arquivo criptografado e, em paralelo, pergunta ao servidor como o cliente confirma.
    const pArquivo = fetch(urlArquivo(`p/${ID}.json`) + '?t=' + Date.now(), {cache:'no-store'})
      .then(r=> r.ok ? r.json() : Promise.reject(r.status)).catch(e=> ({erro:e}));
    let env;
    const abrir = async (k2)=>{
      try{
        if(!env) env = await pArquivo;
        if(env.erro) return false;
        CHAVE = await crypto.subtle.importKey('raw', xorB64(k1, k2), {name:'AES-GCM'}, false, ['decrypt']);
        const dados = JSON.parse(new TextDecoder().decode(await decifrar(b64ParaBytes(env.d))));
        try{ sessionStorage.setItem('lh_k2_'+ID, k2); }catch(e){}
        painel(dados);
        return true;
      }catch(e){ return false; }
    };

    // Já confirmou nesta aba? Entra direto (fechou a aba = precisa confirmar de novo).
    let salvo = null; try{ salvo = sessionStorage.getItem('lh_k2_'+ID); }catch(e){}
    if(salvo && await abrir(salvo)) return;

    let info;
    try{
      const {status, j} = await chamarFuncao({acao:'iniciar', id:ID});
      if(status===404) return telaEstado('🔎', 'Não encontrei seus dados', 'Esse link ainda não foi ativado ou foi substituído. Peça o link atualizado pra LontraHelp.', true);
      if(status!==200) throw new Error('http ' + status);
      info = j;
    }catch(e){
      return telaEstado('📶', 'Sem conexão', 'Não consegui carregar agora. Confira sua internet e tente de novo.', false);
    }
    if(info.metodo==='nenhum') return telaEstado('📇', 'Falta um contato', 'Pra sua segurança, precisamos do seu e-mail ou telefone cadastrado. Fale com a LontraHelp.', true);
    env = await pArquivo;
    if(env.erro===404) return telaEstado('🔎', 'Não encontrei seus dados', 'Esse link ainda não tem informações publicadas. Tente de novo em alguns minutos ou peça o link atualizado.', true);
    if(env.erro) return telaEstado('📶', 'Sem conexão', 'Não consegui carregar agora. Confira sua internet e tente de novo.', false);
    telaBoasVindas(info.nome, ()=> telaCodigo(info, abrir));
    return;
  }

  // Link do sistema antigo (?cliente=...) ou sem a chave - não abre nada.
  if(params.get('cliente') || (ID && !k1)) return telaEstado('🔒', 'Seu link foi atualizado', 'Por segurança, o portal ganhou proteção nova e esse link não funciona mais. Peça o link novo pra LontraHelp - é rapidinho.', true);

  telaEstado('😕', 'Link inválido ou incompleto', 'Peça pra LontraHelp te mandar o link de novo.', true);
}

  }catch(e){ /* sem tema manual: segue pela data */ }
  try{ aplicarTemaSazonal(temaForcado); }catch(e){}
