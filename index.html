<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Acompanhamento — LontraHelp</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#173A5E; --navy-dark:#0F2C48; --navy-darker:#0B2238; --gold:#F4C430;
    --blue-mid:#2C82C9; --blue-bg:#E8F2FB; --green-ok:#2E8B57; --red-no:#C0392B;
    --ink:#1F2933; --ink-soft:#5B6B7A; --border:#E1E8EF; --cream:#F4F7FA;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Inter',sans-serif; background:var(--cream); color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:'Poppins',sans-serif;}
  .topbar{
    background:linear-gradient(180deg, var(--navy) 0%, var(--navy-dark) 100%);
    color:#fff; padding:18px 20px; text-align:center;
  }
  .topbar img{height:44px; margin-bottom:6px;}
  .topbar .brand{font-family:'Poppins',sans-serif; font-weight:800; font-size:20px;}
  .topbar .brand .help{color:var(--gold);}
  .topbar .sub{font-size:11px; opacity:0.8; letter-spacing:0.5px;}
  .wrap{max-width:480px; margin:0 auto; padding:18px 16px 40px;}
  .saudacao{font-size:15px; color:var(--ink-soft); margin-bottom:6px; text-align:center;}
  .saudacao strong{color:var(--navy);}
  .atualizado-em{font-size:10.5px; color:var(--ink-soft); text-align:center; margin-bottom:16px; opacity:0.8;}
  .card{
    background:#fff; border:1px solid var(--border); border-radius:12px;
    padding:16px; margin-bottom:14px; box-shadow:0 2px 8px rgba(15,44,72,0.06);
    cursor:pointer; transition:box-shadow 0.15s;
  }
  .card:active{box-shadow:0 1px 3px rgba(15,44,72,0.1);}
  .card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:10px;}
  .os-num{font-weight:800; color:var(--navy); font-size:15px;}
  .os-data{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
  .titulo{font-size:13.5px; color:var(--ink); margin-bottom:10px; line-height:1.4;}
  .rodape-card{display:flex; justify-content:space-between; align-items:center; padding-top:10px; border-top:1px dashed var(--border);}
  .valor{font-weight:800; color:var(--navy); font-size:14px;}
  .pill{display:inline-block; padding:4px 11px; border-radius:20px; font-size:11.5px; font-weight:700;}
  .pill-blue{background:var(--blue-bg); color:var(--blue-mid);}
  .pill-gold{background:#FFF6DC; color:#9C7A05;}
  .pill-green{background:#E7F5EC; color:var(--green-ok);}
  .pill-red{background:#FDEEEC; color:var(--red-no);}
  .pill-gray{background:#EDEFF2; color:#6B7280;}
  .empty{text-align:center; padding:50px 20px; color:var(--ink-soft);}
  .empty .ic{font-size:40px; margin-bottom:10px;}
  .footer-contato{
    text-align:center; margin-top:28px; padding-top:18px; border-top:1px solid var(--border);
    font-size:12px; color:var(--ink-soft);
  }
  .footer-contato a{color:var(--blue-mid); text-decoration:none; font-weight:600;}
  .spinner{
    width:26px; height:26px; border:3px solid var(--border); border-top-color:var(--blue-mid);
    border-radius:50%; margin:0 auto 12px; animation:girar 0.8s linear infinite;
  }
  @keyframes girar{ to{ transform:rotate(360deg); } }
  .verif-box{
    background:#fff; border-radius:14px; padding:36px 24px; text-align:center;
    box-shadow:0 4px 16px rgba(15,44,72,0.08); margin-top:20px;
  }
  .verif-icone{font-size:38px; margin-bottom:10px;}
  .verif-titulo{font-family:'Poppins',sans-serif; font-weight:700; font-size:18px; color:var(--navy); margin-bottom:8px;}
  .verif-texto{font-size:13.5px; color:var(--ink-soft); line-height:1.5; margin-bottom:20px;}
  .verif-input{
    width:140px; text-align:center; font-size:26px; letter-spacing:10px; font-weight:700;
    padding:12px 8px 12px 18px; border:2px solid var(--border); border-radius:10px;
    color:var(--navy); margin-bottom:12px;
  }
  .verif-input:focus{outline:none; border-color:var(--blue-mid);}
  .verif-erro{color:var(--red-no); font-size:12.5px; margin-bottom:12px; font-weight:600;}
  .verif-btn{
    width:100%; max-width:220px; background:var(--navy); color:#fff; border:none;
    padding:13px; border-radius:10px; font-size:15px; font-weight:700; cursor:pointer;
  }
  .verif-btn:active{opacity:0.85;}
  .docs-expandido{
    margin-top:12px; padding-top:12px; border-top:1px solid var(--border);
    display:flex; flex-direction:column; gap:8px;
  }
  .btn-doc{
    display:flex; align-items:center; justify-content:center; gap:8px;
    background:var(--navy); color:#fff; text-decoration:none;
    padding:10px 14px; border-radius:8px; font-size:13px; font-weight:700;
    border:none; cursor:pointer; width:100%;
  }
  .btn-doc:active{opacity:0.85;}
  .btn-doc.orcamento{background:var(--gold); color:var(--navy);}
  .btn-doc.diagnostico{background:var(--blue-mid);}
  .seta-expandir{font-size:11px; color:var(--ink-soft); text-align:center; margin-top:2px;}
  .info-extra{margin-top:12px; padding-top:12px; border-top:1px solid var(--border);}
  .info-linha{display:flex; justify-content:space-between; gap:10px; font-size:12.5px; margin-bottom:6px;}
  .info-linha .k{color:var(--ink-soft);}
  .info-linha .v{font-weight:600; text-align:right;}
  .garantia-box{
    display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:8px;
    font-size:12px; font-weight:700; margin-top:6px; margin-bottom:2px;
  }
  .garantia-ok{background:#E7F5EC; color:var(--green-ok);}
  .garantia-vencida{background:#FDEEEC; color:var(--red-no);}
  .garantia-sem{background:#EDEFF2; color:#6B7280;}
  .garantia-pendente{background:#FFF8E1; color:#8A6D00;}
  .historico-titulo{font-size:11.5px; font-weight:700; color:var(--ink-soft); margin:10px 0 6px; text-transform:uppercase;}
  .historico-item{display:flex; gap:8px; font-size:12px; margin-bottom:5px; align-items:baseline;}
  .historico-item .bolinha{width:6px; height:6px; border-radius:50%; background:var(--blue-mid); flex-shrink:0;}
  .historico-item .data-hist{color:var(--ink-soft); min-width:82px;}
  .secao-titulo{font-size:13px; font-weight:800; color:var(--navy); margin:20px 0 10px; text-transform:uppercase; letter-spacing:0.3px;}
  .card-agenda{
    background:#fff; border:1px solid var(--border); border-left:4px solid var(--gold); border-radius:10px;
    padding:13px 15px; margin-bottom:10px; box-shadow:0 2px 8px rgba(15,44,72,0.06);
  }
  .card-agenda .ag-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;}
  .card-agenda .ag-data{font-weight:800; color:var(--navy); font-size:13.5px;}
  .card-agenda .ag-titulo{font-size:13px; color:var(--ink);}
  .card-agenda .ag-local{font-size:11.5px; color:var(--ink-soft); margin-top:3px;}
  .sem-docs{font-size:11.5px; color:var(--ink-soft); text-align:center; padding:6px 0;}
  .doc-pendente{font-size:11.5px; color:#8A6D00; text-align:center; padding:9px; background:#FFF8E1; border-radius:8px;}
</style>
</head>

<script>
const STATUS_LABELS = {
  em_andamento: 'Em andamento', em_analise: 'Em análise', esperando_peca: 'Esperando peça',
  manutencao: 'Em manutenção', aguardando_aprovacao: 'Aguardando aprovação do cliente',
  concluido: 'Concluído', pendente_pagamento: 'Pendente pagamento',
  cancelado: 'Cancelado pelo cliente', arquivado: 'Arquivado (pausado)',
};
const STATUS_PILL = {
  em_andamento: 'pill-blue', em_analise: 'pill-blue', esperando_peca: 'pill-gold',
  manutencao: 'pill-blue', aguardando_aprovacao: 'pill-gold', concluido: 'pill-green',
  pendente_pagamento: 'pill-gold', cancelado: 'pill-red', arquivado: 'pill-gray',
};
const NOME_DOC = {recibo: '🧾 Baixar Recibo', orcamento: '📋 Baixar Orçamento', diagnostico: '🔍 Baixar Diagnóstico'};

let OWNER_REPO = null;
function detectarOwnerRepo(){
  if(OWNER_REPO) return OWNER_REPO;
  const host = window.location.hostname;
  const owner = host.split('.')[0];
  const partesCaminho = window.location.pathname.split('/').filter(Boolean);
  const repo = partesCaminho[0] || '';
  OWNER_REPO = {owner, repo};
  return OWNER_REPO;
}
function urlBrutaGithub(caminhoRelativo){
  const {owner, repo} = detectarOwnerRepo();
  return 'https://raw.githubusercontent.com/' + owner + '/' + repo + '/main/' + caminhoRelativo;
}

function formatDateBR(iso){
  if(!iso) return '—';
  const [ano,mes,dia] = iso.split('-');
  return dia + '/' + mes + '/' + ano;
}
function formatMoney(v){
  const n = parseFloat(v);
  if(isNaN(n)) return '0,00';
  return n.toFixed(2).replace('.', ',');
}
function escaparHtml(s){
  const div = document.createElement('div');
  div.textContent = s == null ? '' : String(s);
  return div.innerHTML;
}
function pegarClienteId(){
  return new URLSearchParams(window.location.search).get('cliente');
}
function decodificarDadosDoHash(){
  const hash = window.location.hash || '';
  const m = hash.match(/#d=(.+)/);
  if(!m) return null;
  try{
    let b64 = m[1].replace(/-/g,'+').replace(/_/g,'/');
    const pad = b64.length % 4 === 0 ? '' : '='.repeat(4 - (b64.length % 4));
    return JSON.parse(decodeURIComponent(escape(atob(b64 + pad))));
  }catch(e){ return null; }
}
function renderizarErro(mensagem){
  document.getElementById('conteudo').innerHTML = '<div class="empty"><div class="ic">😕</div>' + escaparHtml(mensagem) + '</div>';
}

function toggleCard(idx){
  const el = document.getElementById('docs-' + idx);
  if(el) el.style.display = el.style.display === 'none' ? 'flex' : 'none';
}
window.toggleCard = toggleCard;

function limparNomeArquivo(texto){
  return texto
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-zA-Z0-9]+/g, '_')
    .replace(/^_+|_+$/g, '');
}
function montarNomeArquivo(tipo, nomeCliente, numeroOS){
  const rotulos = {recibo: 'Recibo', orcamento: 'Orcamento', diagnostico: 'Diagnostico'};
  return limparNomeArquivo(`${rotulos[tipo]}_OS_${numeroOS}_${nomeCliente}`) + '.pdf';
}

function somarDias(isoData, dias){
  const d = new Date(isoData + 'T00:00:00');
  d.setDate(d.getDate() + (parseInt(dias)||0));
  const ano = d.getFullYear(), mes = String(d.getMonth()+1).padStart(2,'0'), dia = String(d.getDate()).padStart(2,'0');
  return `${ano}-${mes}-${dia}`;
}
function hojeISO(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function diasEntre(isoInicio, isoFim){
  const a = new Date(isoInicio + 'T00:00:00'), b = new Date(isoFim + 'T00:00:00');
  return Math.round((b - a) / 86400000);
}

// Monta o bloco de "detalhes" que aparece quando o card é aberto: equipamento, situação da
// garantia (quantos dias faltam, ou se já venceu), e o histórico de quando o status mudou.
function montarInfoExtra(o){
  let html = '<div class="info-extra">';

  if(o.eq){
    html += '<div class="info-linha"><span class="k">Equipamento</span><span class="v">' + escaparHtml(o.eq) + '</span></div>';
  }

  if(o.g === null){
    html += '<div class="garantia-box garantia-sem">➖ Esse serviço não possui garantia</div>';
  } else if(o.g && o.g.pendente){
    html += '<div class="garantia-box garantia-pendente">⏳ A garantia começa a valer quando o serviço for concluído e o equipamento entregue</div>';
  } else if(o.g && o.g.inicio){
    const hoje = hojeISO();
    [['fisica','Física (montagem/reparo)'], ['software','Software/configurações']].forEach(([campo, rotulo])=>{
      const dias = o.g[campo];
      if(!dias) return;
      const fimIso = somarDias(o.g.inicio, dias);
      const restam = diasEntre(hoje, fimIso);
      if(restam >= 0){
        html += '<div class="garantia-box garantia-ok">✔ Garantia ' + rotulo + ': faltam ' + restam + ' dia(s) (até ' + formatDateBR(fimIso) + ')</div>';
      } else {
        html += '<div class="garantia-box garantia-vencida">✘ Garantia ' + rotulo + ' venceu em ' + formatDateBR(fimIso) + '</div>';
      }
    });
  }

  if(o.h && o.h.length > 0){
    html += '<div class="historico-titulo">Histórico</div>';
    o.h.slice().reverse().forEach(ev=>{
      const label = STATUS_LABELS[ev.s] || ev.s;
      let dataFormatada = '—';
      try{ dataFormatada = new Date(ev.d).toLocaleDateString('pt-BR'); }catch(e){}
      html += '<div class="historico-item"><span class="bolinha"></span><span class="data-hist">' + dataFormatada + '</span><span>' + escaparHtml(label) + '</span></div>';
    });
  }

  html += '</div>';
  return html;
}

// Baixa o PDF "por dentro" via JavaScript (busca os bytes e cria um link temporário local) —
// assim o navegador respeita o nome do arquivo escolhido. Um link direto pra um endereço de outro
// site (o GitHub, nesse caso) faz o navegador ignorar o nome e salvar com um nome genérico.
async function baixarComNomeCerto(url, nomeArquivo, botaoEl){
  const textoOriginal = botaoEl.textContent;
  botaoEl.disabled = true;
  botaoEl.textContent = '⏳ Baixando...';
  try{
    const resp = await fetch(url);
    if(!resp.ok) throw new Error('Não consegui baixar o arquivo (' + resp.status + ').');
    const blob = await resp.blob();
    const blobUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = blobUrl;
    link.download = nomeArquivo;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(()=> URL.revokeObjectURL(blobUrl), 3000);
  }catch(e){
    alert('Não consegui baixar esse documento agora. Tenta de novo em instantes.\n\nDetalhe: ' + e.message);
  }finally{
    botaoEl.disabled = false;
    botaoEl.textContent = textoOriginal;
  }
}
window.baixarComNomeCerto = baixarComNomeCerto;

function renderizarDados(dados){
  const el = document.getElementById('conteudo');
  const ordens = (dados.o || []).slice().sort((a,b)=> (b.d||'').localeCompare(a.d||''));
  const agendamentos = (dados.a || [])
    .filter(a => a.s === 'agendado')
    .slice()
    .sort((a,b)=> (a.d+a.h).localeCompare(b.d+b.h));

  let html = '<div class="saudacao">Olá, <strong>' + escaparHtml(dados.c || 'Cliente') + '</strong>! Aqui está o histórico dos seus atendimentos:</div>';
  if(dados.atualizadoEm){
    try{ html += '<div class="atualizado-em">Atualizado em ' + new Date(dados.atualizadoEm).toLocaleString('pt-BR') + '</div>'; }catch(e){}
  }

  if(agendamentos.length > 0){
    html += '<div class="secao-titulo">📅 Próximas visitas marcadas</div>';
    agendamentos.forEach(a=>{
      html += '<div class="card-agenda">'
        + '<div class="ag-top"><span class="ag-data">' + formatDateBR(a.d) + ' às ' + escaparHtml(a.h||'') + '</span></div>'
        + '<div class="ag-titulo">' + escaparHtml(a.t) + '</div>'
        + (a.l ? '<div class="ag-local">📍 ' + escaparHtml(a.l) + '</div>' : '')
      + '</div>';
    });
    html += '<div class="secao-titulo">🧾 Ordens de serviço</div>';
  }

  if(ordens.length === 0){
    html += '<div class="empty"><div class="ic">🧾</div>Nenhuma ordem de serviço encontrada.</div>';
  } else {
    ordens.forEach((o, idx)=>{
      const statusLabel = STATUS_LABELS[o.s] || o.s || 'Em andamento';
      const statusPill = STATUS_PILL[o.s] || 'pill-blue';
      const docs = o.docs || {};
      const temAlgumDoc = docs.recibo || docs.orcamento || docs.diagnostico;

      let botoesDocs = '';
      ['recibo','orcamento','diagnostico'].forEach(tipo=>{
        if(!docs[tipo]) return;
        if(tipo==='recibo' && !o.assinado){
          // Recibo só vale de verdade depois de assinado pelo cliente — antes disso, é só um
          // rascunho, não libera pra download aqui no portal.
          botoesDocs += '<div class="doc-pendente">⏳ Recibo aguardando assinatura — ainda não disponível pra download</div>';
          return;
        }
        const nomeArquivo = montarNomeArquivo(tipo, dados.c, o.n);
        botoesDocs += '<button type="button" class="btn-doc ' + tipo + '" onclick="event.stopPropagation(); baixarComNomeCerto(\'' + urlBrutaGithub(docs[tipo]) + '\', \'' + nomeArquivo.replace(/'/g,"\\'") + '\', this)">' + NOME_DOC[tipo] + (tipo==='recibo' ? ' ✔' : '') + '</button>';
      });
      if(!temAlgumDoc) botoesDocs = '<div class="sem-docs">Nenhum documento disponível pra essa OS ainda.</div>';

      const infoExtra = montarInfoExtra(o);

      html += '<div class="card" onclick="toggleCard(' + idx + ')">'
        + '<div class="card-top">'
          + '<div><div class="os-num">OS #' + escaparHtml(o.n) + '</div><div class="os-data">' + formatDateBR(o.d) + '</div></div>'
          + '<span class="pill ' + statusPill + '">' + escaparHtml(statusLabel) + '</span>'
        + '</div>'
        + '<div class="titulo">' + escaparHtml(o.t || 'Serviço') + '</div>'
        + '<div class="rodape-card"><span style="font-size:11.5px; color:var(--ink-soft);">Valor</span><span class="valor">R$ ' + formatMoney(o.v) + '</span></div>'
        + '<div class="seta-expandir">👆 Toque pra ver os detalhes</div>'
        + '<div class="docs-expandido" id="docs-' + idx + '" style="display:none;">' + infoExtra + botoesDocs + '</div>'
      + '</div>';
    });
  }

  html += '<div class="footer-contato">'
    + 'LontraHelp — Montagem e Formatação<br/>'
    + '<a href="https://wa.me/5581986234860" target="_blank">📱 (81) 9 8623-4860</a> &nbsp;|&nbsp; @lontrahelp'
  + '</div>';

  el.innerHTML = html;
}

function renderizarTelaVerificacao(dados, clienteId){
  const el = document.getElementById('conteudo');
  el.innerHTML = `
    <div class="verif-box">
      <div class="verif-icone">🔒</div>
      <div class="verif-titulo">Confirme sua identidade</div>
      <div class="verif-texto">Pra proteger seus dados, digite os <strong>últimos 4 números</strong> do seu telefone cadastrado.</div>
      <input type="tel" inputmode="numeric" maxlength="4" id="verif-input" class="verif-input" placeholder="0000" autocomplete="off" />
      <div class="verif-erro" id="verif-erro" style="display:none;">Números incorretos. Tenta de novo.</div>
      <button type="button" class="verif-btn" id="verif-btn">Entrar</button>
    </div>
  `;
  const input = document.getElementById('verif-input');
  const erroEl = document.getElementById('verif-erro');
  input.focus();

  const tentar = ()=>{
    const digitado = (input.value||'').trim();
    if(digitado.length===4 && dados.v4 && digitado===dados.v4){
      try{ sessionStorage.setItem('lh_verif_' + clienteId, '1'); }catch(e){}
      renderizarDados(dados);
    } else {
      erroEl.style.display = 'block';
      input.value = '';
      input.focus();
    }
  };
  document.getElementById('verif-btn').addEventListener('click', tentar);
  input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') tentar(); });
}

async function iniciar(){
  const clienteId = pegarClienteId();
  if(clienteId){
    const {owner, repo} = detectarOwnerRepo();
    if(!owner || !repo){ renderizarErro('Não consegui identificar o repositório. Peça pro técnico conferir a configuração.'); return; }
    const url = 'https://raw.githubusercontent.com/' + owner + '/' + repo + '/main/dados/' + encodeURIComponent(clienteId) + '.json?t=' + Date.now();
    try{
      const resp = await fetch(url, {cache: 'no-store'});
      if(!resp.ok){
        renderizarErro(resp.status === 404 ? 'Ainda não há dados pra esse link. Peça pro técnico gerar de novo.' : 'Não consegui carregar os dados agora. Tenta de novo em instantes.');
        return;
      }
      const dados = await resp.json();
      // Se não tiver os 4 dígitos configurados (link antigo, gerado antes dessa proteção existir),
      // mostra os dados direto — não dá pra pedir uma verificação que não existe ainda.
      let jaVerificado = false;
      try{ jaVerificado = sessionStorage.getItem('lh_verif_' + clienteId) === '1'; }catch(e){}
      if(!dados.v4 || jaVerificado){
        renderizarDados(dados);
      } else {
        renderizarTelaVerificacao(dados, clienteId);
      }
    }catch(e){
      renderizarErro('Sem conexão ou erro ao carregar. Confere sua internet e tenta de novo.');
    }
    return;
  }
  const dadosAntigos = decodificarDadosDoHash();
  if(dadosAntigos){ renderizarDados(dadosAntigos); return; }
  renderizarErro('Link inválido ou incompleto. Peça pro técnico gerar o link de novo.');
}
iniciar();
</script>
